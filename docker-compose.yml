services:
  assetto:
    image: ghcr.io/simonedevkt/dockerac:latest
    # to build locally instead of pulling: docker compose build
    build: .
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 30s
    environment:
      # password for the setup page; if empty a random one is printed in the logs
      SETUP_PASSWORD: ""
      # owner of the files in ./data
      PUID: 1000
      PGID: 1000
      # set to 1 to show the setup page again (update ACSM, add plugins),
      # or create an empty file ./data/.reconfigure
      SETUP: 0
    volumes:
      - ./data:/data
    ports:
      # setup page / server manager web interface
      - 8772:8772
      # one TCP+UDP game port and one HTTP port per server instance
      - 9600-9604:9600-9604
      - 9600-9604:9600-9604/udp
      - 8081-8085:8081-8085
      # stracker
      - 9642-9646:9642-9646
      - 9642-9646:9642-9646/udp
      - 50041-50045:50041-50045
      # real penalty
      - 8108-8112:8108-8112
      - 8108-8112:8108-8112/udp
      # kissmyrank
      - 7789-7793:7789-7793
      - 13000-13004:13000-13004
