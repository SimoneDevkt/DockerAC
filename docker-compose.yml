services:
  assetto:
    image: ghcr.io/simonedevkt/dockerac:latest
    # to build locally instead of pulling: docker compose build
    build: .
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 30s
    environment:
      # password for the setup page; if empty a random one is printed in the logs
      SETUP_PASSWORD: ""
      # owner of the files in ./data
      PUID: 1000
      PGID: 1000
      # set to 1 to show the setup page again (update ACSM, add plugins),
      # or create an empty file ./data/.reconfigure
      SETUP: 0
    volumes:
      - ./data:/data
    ports:
      # setup page / server manager web interface
      - 8772:8772
      # one TCP+UDP game port and one HTTP port per server instance
      - 9600-9609:9600-9609
      - 9600-9609:9600-9609/udp
      - 8081-8090:8081-8090
      # stracker
      - 9642-9651:9642-9651
      - 9642-9651:9642-9651/udp
      - 50041-50050:50041-50050
      # real penalty
      - 8108-8117:8108-8117
      - 8108-8117:8108-8117/udp
      # kissmyrank
      - 7789-7798:7789-7798
      - 13000-13009:13000-13009
